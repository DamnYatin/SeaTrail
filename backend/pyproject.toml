[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sealtrail-backend"
version = "1.0.0"
description = "Digital Evidence Chain-of-Custody API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.2",
    "boto3>=1.34.131",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.8",
    "reportlab>=4.2.0",
    "qrcode[pil]>=7.4.2",
    "pyzipper>=0.3.6",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
